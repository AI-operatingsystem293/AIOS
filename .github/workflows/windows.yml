name: Build Windows AIOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build AIOS
        run: cargo build --release

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Windows ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item target/release/aios.exe package/aios.exe
          if (Test-Path README.md) {
            Copy-Item README.md package/README.md
          }
          Compress-Archive -Path package/* -DestinationPath AIOS-Windows.zip -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AIOS-Setup-Windows
          path: dist/AIOS-Setup.exe

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AIOS-Windows
          path: AIOS-Windows.zip
